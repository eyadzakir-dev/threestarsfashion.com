    <style>
        /* ============================================
           LOGISTICS PAGE - GREEN ACCENT OVERRIDES
           Theme: Beige/Off-white with Green Accents
           ============================================ */

        /* Green color palette for GPL integration */
        :root {
            --color-gpl-green: #1D8348;
            --color-gpl-green-light: #27AE60;
            --color-gpl-green-dark: #145A32;
            --color-gpl-gradient: linear-gradient(135deg, #1D8348 0%, #27AE60 50%, #145A32 100%);
        }

        /* Override accent colors for this page */
        .logistics-page .section-label {
            color: var(--color-gpl-green);
        }

        .logistics-page .page-label {
            color: var(--color-gpl-green-light);
        }

        /* Hero Section - Green gradient accents */
        .logistics-hero {
            position: relative;
            min-height: 80vh;
            display: flex;
            align-items: center;
            padding: var(--space-32) var(--container-padding) var(--space-16);
            overflow: hidden;
            background: linear-gradient(135deg, var(--color-navy) 0%, var(--color-navy-dark) 100%);
        }

        .logistics-hero::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            background: var(--color-gpl-gradient);
            opacity: 0.15;
            clip-path: polygon(30% 0, 100% 0, 100% 100%, 0% 100%);
        }

        .logistics-hero-content {
            position: relative;
            z-index: 1;
            max-width: var(--container-max);
            margin: 0 auto;
            text-align: center;
        }

        .logistics-hero .hero-label {
            color: var(--color-gpl-green-light);
            font-family: var(--font-body);
            font-size: var(--text-sm);
            font-weight: var(--font-bold);
            letter-spacing: 0.2em;
            margin-bottom: var(--space-6);
            display: inline-block;
        }

        .logistics-hero .hero-title {
            font-family: var(--font-heading);
            font-size: clamp(var(--text-4xl), 6vw, var(--text-6xl));
            font-weight: var(--font-bold);
            line-height: 1.1;
            margin-bottom: var(--space-6);
            color: var(--color-white);
        }

        .logistics-hero .hero-title .light {
            font-weight: var(--font-light);
        }

        .logistics-hero .hero-subtitle {
            font-family: var(--font-body);
            font-size: var(--text-xl);
            color: rgba(255, 255, 255, 0.8);
            max-width: 700px;
            margin: 0 auto var(--space-8);
            line-height: 1.7;
        }

        /* Partnership Section */
        .partnership-section {
            padding: var(--space-24) var(--container-padding);
            background-color: var(--color-background);
        }

        .partnership-container {
            max-width: var(--container-max);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-16);
            align-items: center;
        }

        .partnership-text h2 {
            font-family: var(--font-heading);
            font-size: var(--text-4xl);
            color: var(--color-navy);
            margin-bottom: var(--space-6);
            line-height: 1.2;
        }

        .partnership-text h2 .green-highlight {
            color: var(--color-gpl-green);
        }

        .partnership-text p {
            font-family: var(--font-body);
            font-size: var(--text-lg);
            color: var(--color-text-secondary);
            line-height: 1.8;
            margin-bottom: var(--space-6);
        }

        .partnership-stats {
            display: flex;
            gap: var(--space-8);
            margin-top: var(--space-8);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: var(--font-heading);
            font-size: var(--text-4xl);
            font-weight: var(--font-bold);
            color: var(--color-gpl-green);
        }

        .stat-label {
            font-family: var(--font-body);
            font-size: var(--text-sm);
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .partnership-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-6);
            padding: var(--space-12);
            background-color: var(--color-white);
            border-radius: var(--radius-xl);
            box-shadow: 0 15px 50px rgba(27, 42, 78, 0.1);
        }

        .partner-logo {
            max-width: 120px;
            height: auto;
            transition: transform 0.3s ease;
        }

        .partner-logo:hover {
            transform: scale(1.05);
        }

        .partner-plus {
            font-size: var(--text-4xl);
            color: var(--color-gpl-green);
            font-weight: var(--font-bold);
        }

        /* Services Grid */
        .services-grid-section {
            padding: var(--space-24) var(--container-padding);
            background-color: var(--color-background-alt);
        }

        .services-grid-container {
            max-width: var(--container-max);
            margin: 0 auto;
        }

        .services-grid-container .section-header {
            text-align: center;
            margin-bottom: var(--space-12);
        }

        .logistics-services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-6);
        }

        .logistics-service-card {
            background-color: var(--color-white);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            text-align: center;
            box-shadow: 0 10px 40px rgba(27, 42, 78, 0.08);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .logistics-service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--color-gpl-gradient);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .logistics-service-card:hover::before {
            transform: scaleX(1);
        }

        .logistics-service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 60px rgba(27, 42, 78, 0.15);
        }

        .service-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto var(--space-6);
            background: linear-gradient(135deg, rgba(29, 131, 72, 0.1) 0%, rgba(39, 174, 96, 0.1) 100%);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .logistics-service-card:hover .service-icon {
            background: var(--color-gpl-gradient);
        }

        .service-icon svg {
            width: 40px;
            height: 40px;
            stroke: var(--color-gpl-green);
            transition: stroke 0.3s ease;
        }

        .logistics-service-card:hover .service-icon svg {
            stroke: var(--color-white);
        }

        .logistics-service-card h3 {
            font-family: var(--font-heading);
            font-size: var(--text-xl);
            color: var(--color-navy);
            margin-bottom: var(--space-3);
        }

        .logistics-service-card p {
            font-family: var(--font-body);
            font-size: var(--text-base);
            color: var(--color-text-muted);
            line-height: 1.6;
        }

        /* Process Timeline */
        .process-section {
            padding: var(--space-24) var(--container-padding);
            background-color: var(--color-background);
        }

        .process-container {
            max-width: var(--container-max);
            margin: 0 auto;
        }

        .process-container .section-header {
            text-align: center;
            margin-bottom: var(--space-16);
        }

        .process-timeline {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
        }

        .process-timeline::before {
            content: '';
            position: absolute;
            top: 50px;
            left: 10%;
            right: 10%;
            height: 4px;
            background: linear-gradient(90deg, var(--color-navy) 0%, var(--color-gpl-green) 50%, var(--color-gpl-green-light) 100%);
            border-radius: 2px;
            z-index: 0;
        }

        .process-step {
            flex: 1;
            text-align: center;
            position: relative;
            z-index: 1;
            padding: 0 var(--space-4);
        }

        .step-number {
            width: 100px;
            height: 100px;
            margin: 0 auto var(--space-6);
            background: var(--color-white);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-size: var(--text-3xl);
            font-weight: var(--font-bold);
            color: var(--color-gpl-green);
            box-shadow: 0 10px 40px rgba(27, 42, 78, 0.15);
            transition: all 0.3s ease;
            border: 4px solid var(--color-gpl-green);
        }

        .process-step:hover .step-number {
            background: var(--color-gpl-green);
            color: var(--color-white);
            transform: scale(1.1);
        }

        .process-step h4 {
            font-family: var(--font-heading);
            font-size: var(--text-xl);
            color: var(--color-navy);
            margin-bottom: var(--space-3);
        }

        .process-step p {
            font-family: var(--font-body);
            font-size: var(--text-base);
            color: var(--color-text-muted);
            line-height: 1.6;
        }

        /* CTA Section */
        .logistics-cta-section {
            padding: var(--space-24) var(--container-padding);
            background: linear-gradient(135deg, var(--color-navy) 0%, var(--color-navy-dark) 100%);
            text-align: center;
        }

        .logistics-cta-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .logistics-cta-container h2 {
            font-family: var(--font-heading);
            font-size: var(--text-4xl);
            color: var(--color-white);
            margin-bottom: var(--space-4);
        }

        .logistics-cta-container p {
            font-family: var(--font-body);
            font-size: var(--text-lg);
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: var(--space-10);
        }

        .gpl-cta-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-5) var(--space-12);
            background-color: var(--color-accent);
            color: var(--color-white);
            border: none;
            border-radius: var(--radius-full);
            font-family: var(--font-body);
            font-size: var(--text-lg);
            font-weight: var(--font-semibold);
            letter-spacing: 0.05em;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(229, 34, 34, 0.4);
        }

        .gpl-cta-btn:hover {
            background-color: var(--color-accent-dark);
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(229, 34, 34, 0.5);
        }

        .gpl-cta-btn svg {
            width: 24px;
            height: 24px;
            transition: transform 0.3s ease;
        }

        .gpl-cta-btn:hover svg {
            transform: translateX(4px);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .partnership-container {
                grid-template-columns: 1fr;
                gap: var(--space-10);
            }

            .logistics-services-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .process-timeline {
                flex-direction: column;
                gap: var(--space-8);
            }

            .process-timeline::before {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .logistics-services-grid {
                grid-template-columns: 1fr;
            }

            .partnership-stats {
                flex-direction: column;
                gap: var(--space-4);
            }
        }
    </style>
