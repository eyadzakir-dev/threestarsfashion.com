    <style>
        /* Facilities Page Specific Styles - Enhanced 3D Effects */
        .facilities-grid-new {
            max-width: var(--container-max);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-8);
            padding: 0 var(--container-padding);
        }

        .facility-box {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background-color: var(--color-white);
            box-shadow:
                0 10px 30px rgba(27, 42, 78, 0.12),
                0 4px 10px rgba(27, 42, 78, 0.08);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .facility-box:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow:
                0 25px 60px rgba(27, 42, 78, 0.2),
                0 15px 30px rgba(27, 42, 78, 0.15);
        }

        .facility-box.clickable {
            cursor: pointer;
        }

        /* Dark overlay with "View Gallery" text on the image area */
        .facility-box.clickable::before {
            content: 'View Gallery';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(27, 42, 78, 0.6);
            color: var(--color-white);
            font-family: var(--font-body);
            font-size: var(--text-lg);
            font-weight: var(--font-semibold);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.35s ease;
            z-index: 2;
            pointer-events: none;
        }

        .facility-box.clickable:hover::before {
            opacity: 1;
        }

        .facility-box-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .facility-box:hover .facility-box-image {
            transform: scale(1.08);
        }

        .facility-box-content {
            padding: var(--space-6);
            background-color: var(--color-white);
            position: relative;
            z-index: 1;
        }

        .facility-box-title {
            font-family: var(--font-heading);
            font-size: var(--text-xl);
            font-weight: var(--font-semibold);
            color: var(--color-navy);
            margin-bottom: var(--space-2);
        }

        .facility-box-desc {
            font-family: var(--font-body);
            font-size: var(--text-sm);
            color: var(--color-text-secondary);
            line-height: 1.6;
        }

        /* Gallery Modal Styles */
        .gallery-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(27, 42, 78, 0.95);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-modal.active {
            display: flex;
            opacity: 1;
        }

        .gallery-container {
            max-width: 1200px;
            width: 90%;
            max-height: 90vh;
            position: relative;
        }

        .gallery-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: none;
            border: none;
            color: var(--color-white);
            font-size: var(--text-3xl);
            cursor: pointer;
            padding: 10px;
            transition: var(--transition-base);
        }

        .gallery-close:hover {
            color: var(--color-accent);
            transform: scale(1.1);
        }

        .gallery-title {
            font-family: var(--font-heading);
            font-size: var(--text-2xl);
            color: var(--color-white);
            text-align: center;
            margin-bottom: var(--space-6);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-4);
            max-height: 70vh;
            overflow-y: auto;
            padding: var(--space-4);
        }

        /* Gallery Item with 3D Magnification Effect */
        .gallery-item {
            aspect-ratio: 4/3;
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .gallery-item:hover {
            transform: scale(1.08) translateY(-8px);
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 10px 20px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .facilities-grid-new {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .facilities-grid-new {
                grid-template-columns: 1fr;
            }
        }

        /* ===== Lightbox Overlay ===== */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .lightbox-image {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            display: block;
            border-radius: var(--radius-md);
        }

        .lightbox-btn {
            position: absolute;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            padding: 16px;
            transition: color 0.2s ease, transform 0.2s ease;
            font-family: var(--font-body);
        }

        .lightbox-btn:hover {
            color: #fff;
            transform: scale(1.15);
        }

        .lightbox-btn:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 4px;
            border-radius: var(--radius-sm);
        }

        .lightbox-close {
            top: 20px;
            right: 20px;
            font-size: 2.4rem;
            line-height: 1;
        }

        .lightbox-prev,
        .lightbox-next {
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.8rem;
            line-height: 1;
        }

        .lightbox-prev:hover,
        .lightbox-next:hover {
            transform: translateY(-50%) scale(1.15);
        }

        .lightbox-prev {
            left: 16px;
        }

        .lightbox-next {
            right: 16px;
        }

        .lightbox-counter {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-family: var(--font-body);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            letter-spacing: 0.1em;
        }

        /* Responsive: stack arrows below image on small screens */
        @media (max-width: 600px) {
            .lightbox-prev {
                left: 4px;
                font-size: 2rem;
            }

            .lightbox-next {
                right: 4px;
                font-size: 2rem;
            }

            .lightbox-close {
                top: 10px;
                right: 10px;
                font-size: 2rem;
            }
        }
    </style>
